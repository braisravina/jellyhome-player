# The mypy gate's environment in the Linux full-test CI job (.github/workflows/tests.yml),
# installed ON TOP OF linux/requirements-linux-cp313-amd64.lock into a venv of its own.
# Python 3.13 / amd64. Hash-pinned and installed with --require-hashes --no-deps, like the
# Debian lock; the hashes are the PyPI wheel digests (trust on first use: not a signature).
#
# Why a separate venv: tools/mypy-baseline.txt was recorded with the `all` extra installed
# (it expects pystray "installed, but missing library stubs" and no finding for pypresence,
# which ships py.typed), while the test suite is measured WITHOUT those extras. One venv
# for both would change one of the two. Only the `mypy` executable from this venv is put
# on PATH; mypy resolves imports through its own interpreter.
#
# mypy 2.4.0 and its dependencies are the releases current on 2026-10-24, the day the
# baseline was last recorded (commit aaded8f6). Raising the pin can add or drop findings:
# re-run tools/mypy_gate.sh with the new version and re-baseline in the same commit.
